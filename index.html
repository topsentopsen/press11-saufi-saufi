<style>
  html { height: 100%; height: 100vh; height: 100dvh; height: -webkit-fill-available; }
  html, body { margin: 0; background: #1b1530; overflow: hidden;
    touch-action: none; overscroll-behavior: none; -webkit-text-size-adjust: 100%;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { position: fixed; inset: 0; width: 100%; height: 100%; height: 100vh; height: 100dvh; max-height: 100dvh;
    height: -webkit-fill-available; max-height: -webkit-fill-available;
    display: flex; align-items: center; justify-content: center; box-sizing: border-box;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif; }
  #rahmen { position: relative; line-height: 0; box-shadow: 0 0 0 4px #ff4fa0, 0 0 0 7px #4fe6ff, 0 8px 30px rgba(0,0,0,.55); border-radius: 6px;
    padding: 0; touch-action: none; display: flex; flex-direction: column; align-items: stretch;
    /* Safe-Area nur am Body. Knöpfe im Rahmen nicht noch einmal einrücken. */ }
  canvas { display: block; }
  #spiel { image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; cursor: pointer; -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; flex: 0 0 auto; }
  .knopf { border: 0; padding: 0; margin: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: none; line-height: 1;
    font: bold 13px ui-rounded, "Trebuchet MS", system-ui, sans-serif; color: #4a3560; min-width: 44px; min-height: 44px;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #ton-hinweis { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 56px); bottom: auto; transform: translateX(-50%);
    z-index: 20; margin: 0; padding: 4px 10px; border-radius: 8px; background: rgba(42, 35, 66, .92); color: #fff8ee;
    font: bold 11px ui-rounded, "Trebuchet MS", system-ui, sans-serif; font-size: 11px; text-align: center; pointer-events: none;
    box-shadow: 0 0 0 2px #ff4fa0; max-width: 80vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ton-hinweis[hidden] { display: none; }
  /* Hoch+Touch: Hinweis ueber der Bedienleiste, Stick/E/Wasser frei (links ≥120, rechts ≥150) */
  #rahmen.touch.hoch ~ #ton-hinweis {
    top: auto; bottom: calc(var(--bedien, 0px) + 6px + env(safe-area-inset-bottom, 0px));
    left: max(120px, env(safe-area-inset-left, 0px)); right: max(150px, env(safe-area-inset-right, 0px));
    width: auto; transform: none; max-width: none; font-size: 11px; }
  .knopf:focus-visible { outline: 3px solid #ffd36e; outline-offset: 1px; }
  /* Oben-rechts: 44px Touchziel, sichtbarer Kreis ≥36px (inset 4px) */
  #oben { position: absolute; top: calc(var(--s, 3) * 1px); right: calc(var(--s, 3) * 1px); display: flex; gap: 2px; z-index: 2; }
  #oben .knopf { width: 44px; height: 44px; border-radius: 50%; background: transparent; box-shadow: none;
    font-size: 12px; position: relative; color: #4a3560; isolation: isolate; }
  #oben .knopf::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: #fff8ee;
    box-shadow: 0 0 0 1.5px #4a3560; z-index: -1; pointer-events: none; }
  #ton-knopf.aus::before { background: #e3dbea; }
  #ton-knopf.aus { text-decoration: line-through; }
  #musik-knopf.aus { text-decoration: line-through; opacity: .55; }
  /* Bedienleiste: Hochformat unter dem Spielfeld; Querformat Overlay unten am Canvas */
  #bedien { display: none; position: relative; flex: 0 0 auto; width: 100%; height: 0; overflow: visible; z-index: 1; }
  #rahmen.touch #bedien { display: block; }
  #rahmen.touch.hoch #bedien { position: relative; height: var(--bedien, 112px); background: #1b1530; border-radius: 0; }
  /* Im Spiel: Leiste über der Welt, kein eigener dunkler Streifen. Auswahl behält die Regel oben. */
  #rahmen.touch.hoch.spiel #bedien {
    position: absolute; left: 0; right: 0; bottom: 0; height: var(--bedien, 132px);
    background: linear-gradient(to top, rgba(27,21,48,0.22) 0%, rgba(27,21,48,0) 72%);
    pointer-events: none; z-index: 3; }
  #rahmen.touch.hoch.spiel #stick, #rahmen.touch.hoch.spiel #touch { pointer-events: auto; }
  /* Touch: Joystick links, Aktionsknoepfe rechts; ohne Touch / bei Overlay keine Pointer-Events */
  #stick { display: none; position: absolute; left: 0; bottom: 0; width: 50%; height: 100%;
    touch-action: none; pointer-events: none; z-index: 1; }
  #rahmen.touch #stick { display: block; }
  #rahmen.touch:not(.overlay) #stick { pointer-events: auto; }
  #rahmen.overlay #stick { pointer-events: none; }
  /* Querformat: Bedien als Overlay ueber der Canvas-Unterkante (kein eigener Streifen) */
  #rahmen.touch:not(.hoch) #bedien {
    position: absolute; left: 0; right: 0; bottom: 0; height: 46%; pointer-events: none; background: transparent; }
  #rahmen.touch:not(.hoch) #stick { width: 50%; height: 100%; }
  #rahmen.touch:not(.hoch) #touch { bottom: calc(var(--s, 3) * 2px); right: calc(var(--s, 3) * 2px); }
  #stick-basis { display: none; position: absolute; width: 80px; height: 80px; margin: -40px 0 0 -40px; border-radius: 50%; background: rgba(255,248,238,.22); box-shadow: 0 0 0 2px rgba(74,53,96,.6); pointer-events: none; }
  #stick-dau { position: absolute; left: 25px; top: 25px; width: 30px; height: 30px; border-radius: 50%; background: rgba(255,248,238,.85); box-shadow: 0 0 0 2px #4a3560; }
  #touch { display: none; position: absolute; right: max(8px, env(safe-area-inset-right, 0px)); bottom: max(8px, env(safe-area-inset-bottom, 0px)); z-index: 2; pointer-events: auto; }
  #rahmen.touch #touch { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  #rahmen.ende #knopf-aktion, #rahmen.ende #knopf-wasser, #rahmen.ende #knopf-item, #rahmen.ende #knopf-f { display: none !important; }
  /* Hochformat: das Body-Padding ist das eine Safe-Area-Inset. Auswahl bleibt eine Zeile. */
  #rahmen.touch.hoch #touch { top: 0; bottom: 8px; right: 8px; flex-direction: row-reverse; align-items: center; }
  #knopf-reihe, #knopf-haupt { display: contents; }
  /* Im Spiel: Daumencluster auf der Welt. Oben F und Item (56), unten E und Trinken. */
  #rahmen.touch.hoch.spiel #touch {
    top: auto; bottom: 20px; right: 10px; width: max-content;
    flex-direction: column; align-items: flex-end; gap: 8px; }
  #rahmen.touch.hoch.spiel #knopf-reihe,
  #rahmen.touch.hoch.spiel #knopf-haupt { display: flex; flex-direction: row; gap: 8px; align-items: flex-end; }
  #rahmen.touch.hoch.spiel #knopf-f,
  #rahmen.touch.hoch.spiel #knopf-item {
    width: 56px; height: 56px; min-width: 56px; min-height: 56px; font-size: 16px; }
  #rahmen.touch.hoch.spiel #knopf-aktion { height: 80px; font-size: 16px !important; }
  #rahmen.touch.hoch.spiel #knopf-wasser { font-size: 15px; line-height: 1.12; }
  #rahmen.touch.hoch #stick { left: 0; bottom: 0; }
  /* Im Spiel größer (+30 %). Auswahl behält die Maße oben. */
  #rahmen.spiel #stick-basis { width: 104px; height: 104px; margin: -52px 0 0 -52px; }
  #rahmen.spiel #stick-dau { left: 32px; top: 32px; width: 40px; height: 40px; }
  #rahmen.spiel #knopf-aktion { min-width: 94px; width: max(73px, calc(var(--s, 3) * 23px)); height: max(73px, calc(var(--s, 3) * 23px)); font-size: 21px !important; }
  #rahmen.spiel #knopf-wasser { min-width: 80px; width: 80px; height: 80px; font-size: 15px; }
  #rahmen.spiel #knopf-item, #rahmen.spiel #knopf-f { width: max(58px, calc(var(--s, 3) * 17px)); height: max(58px, calc(var(--s, 3) * 17px)); font-size: 16px; }
  /* Links unter dem HUD, nicht oben rechts: dort liegt in Sophies Brauhaus die Jukebox. */
  #zoom { display: none; position: absolute; left: 8px; right: auto; top: 156px; z-index: 4; flex-direction: column; gap: 8px; }
  #rahmen.spiel:not(.overlay):not(.ende) #zoom { display: flex; }
  #zoom .knopf { width: 56px; height: 56px; border-radius: 16px; background: #fff8ee; color: #4a3560; box-shadow: 0 0 0 3px #4a3560; font-size: 28px; }
  #touch .knopf { border-radius: 50%; background: #fff8ee; box-shadow: 0 0 0 3px #4a3560, inset 0 0 0 5px #ffb037; min-width: 44px; min-height: 44px; }
  .knopf.aus { opacity: .45; }
  #knopf-aktion, #knopf-wasser, #knopf-item { border-radius: 14px !important; line-height: 1.05; padding: 2px 4px; overflow: hidden; white-space: normal; word-break: break-word; }
  #knopf-aktion { min-width: 72px; font-size: 13px !important; width: max(56px, calc(var(--s, 3) * 18px)); height: max(56px, calc(var(--s, 3) * 18px)); font-size: 16px; }
  #knopf-wasser { width: max(44px, calc(var(--s, 3) * 13px)); height: max(44px, calc(var(--s, 3) * 13px)); box-shadow: 0 0 0 3px #4a3560, inset 0 0 0 4px #7ec8e3 !important; font-size: 12px; min-width: 56px; }
  #knopf-item, #knopf-f { display: none; width: max(44px, calc(var(--s, 3) * 13px)); height: max(44px, calc(var(--s, 3) * 13px)); box-shadow: 0 0 0 3px #4a3560, inset 0 0 0 4px #ff4fa0 !important; font-size: 12px; }
  #touch .knopf:active { transform: translateY(3px); }
  /* YouTube-Fenster (Einbettung, ein-/ausklappbar, API mind. 200x113); Desktop unten links */
  #yt-fenster { position: fixed; left: max(8px, env(safe-area-inset-left, 0px)); bottom: max(8px, env(safe-area-inset-bottom, 0px)); width: 220px; background: #2a2342; border-radius: 8px; box-shadow: 0 0 0 2px #ff4fa0; z-index: 10; overflow: hidden; }
  #yt-fenster[hidden] { display: none; }
  /* Overlay offen: Mini-Player ausblenden (Musik laeuft weiter) */
  #rahmen.overlay ~ #yt-fenster { visibility: hidden; pointer-events: none; }
  /* Touch Quer: oben/mittig unter den Oben-Knoepfen, nicht ueber Stick/E */
  #rahmen.touch:not(.hoch) ~ #yt-fenster {
    top: max(52px, calc(env(safe-area-inset-top, 0px) + 48px)); bottom: auto; left: 50%; right: auto;
    width: 160px; transform: translateX(-50%) scale(0.85); transform-origin: top center; z-index: 5; }
  /* Hoch+Touch: ueber #bedien, Breite ≤160, unter den Bedien-Knoepfen (z-index) */
  #rahmen.touch.hoch ~ #yt-fenster {
    top: auto; bottom: calc(var(--bedien, 0px) + 8px + env(safe-area-inset-bottom, 0px));
    left: max(6px, env(safe-area-inset-left, 0px)); right: auto;
    width: 160px; max-width: 160px; transform: none; z-index: 0; pointer-events: auto; }
  #yt-leiste { display: flex; align-items: center; justify-content: space-between; padding: 3px 6px; color: #fff8ee; font: bold 11px ui-rounded, "Trebuchet MS", system-ui, sans-serif; }
  #yt-klapp { background: #fff8ee; border-radius: 6px; padding: 6px 10px; font-size: 11px; min-width: 44px; min-height: 44px; }
  #yt-rahmen { width: 220px; height: 124px; }
  #yt-fenster.zu #yt-rahmen { display: none; }
  #yt-rahmen iframe { width: 220px; height: 124px; display: block; }
  #rahmen.touch ~ #yt-fenster #yt-rahmen, #rahmen.touch ~ #yt-fenster #yt-rahmen iframe { width: 160px; height: 90px; }
  #debug { position: fixed; right: 4px; top: 4px; margin: 0; padding: 4px 6px; background: rgba(0,0,0,.75); color: #9f9; font: 10px ui-monospace, monospace; line-height: 1.2; z-index: 30; pointer-events: none; }
  #debug[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<body>
<div id="rahmen">
  <canvas id="spiel" width="320" height="176" tabindex="0" aria-label="Press11 - Stuttgart Edition"></canvas>
  <div id="zoom">
    <button id="zoom-plus" class="knopf" type="button" title="Näher" aria-label="Näher zoomen">+</button>
    <button id="zoom-minus" class="knopf" type="button" title="Weiter" aria-label="Weiter zoomen">−</button>
  </div>
  <div id="oben">
    <button id="playlist-knopf" class="knopf" type="button" title="Scooter-Playlist (Taste P)" aria-label="Scooter-Playlist">&#9835;</button>
    <button id="musik-knopf" class="knopf" type="button" title="Musik an oder aus (Taste N)" aria-label="Musik an oder aus">&#9836;</button>
    <button id="ton-knopf" class="knopf" type="button" title="Ton an oder aus (Taste M)" aria-label="Ton an oder aus">&#9834;</button>
    <button id="vollbild-knopf" class="knopf" type="button" title="Vollbild" aria-label="Vollbild">&#9974;</button>
    <button id="info-knopf" class="knopf" type="button" title="Hinweis 18+" aria-label="Hinweis 18 plus">i</button>
  </div>
  <div id="bedien">
    <div id="stick" aria-hidden="true"><div id="stick-basis"><div id="stick-dau"></div></div></div>
    <div id="touch">
      <div id="knopf-reihe">
        <button id="knopf-f" class="knopf" type="button" aria-label="Press F">F</button>
        <button id="knopf-item" class="knopf" type="button" aria-label="Item benutzen">R</button>
      </div>
      <div id="knopf-haupt">
        <button id="knopf-aktion" class="knopf" type="button" aria-label="Aktion">E</button>
        <button id="knopf-wasser" class="knopf" type="button" aria-label="Wasser trinken">Wasser</button>
      </div>
    </div>
  </div>
</div>
<!-- Kleines Fenster fuer die YouTube-Einbettung (Scooter-Playlist). Bleibt versteckt, bis YouTube wirklich gewaehlt und verfuegbar ist. -->
<div id="yt-fenster" hidden>
  <div id="yt-leiste"><span>Scooter (YouTube)</span><button id="yt-klapp" class="knopf" type="button">&ndash; Scooter</button></div>
  <div id="yt-rahmen"><div id="yt-player"></div></div>
</div>
<div id="ton-hinweis" hidden>Tippen für Ton</div>
