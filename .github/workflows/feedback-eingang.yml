name: Feedback-Eingang

on:
  repository_dispatch:
    types: [press11-feedback]

permissions:
  issues: write

jobs:
  anlegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const p = context.payload.client_payload || {};
            const art = p.art === 'idee' || p.art === 'sprache' ? p.art : (p.art === 'feedback' ? 'feedback' : '');
            if (!art) {
              core.setFailed('Art fehlt');
              return;
            }
            let text = String(p.text == null ? '' : p.text).replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();
            if (!text) {
              core.setFailed('Text fehlt');
              return;
            }
            if (text.length > 4000) text = text.slice(0, 4000);
            let name = String(p.name == null ? '' : p.name).replace(/\s+/g, ' ').trim();
            if (name.length > 80) name = name.slice(0, 80);
            function eine(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim(); }
            function vorschau(s) {
              const z = eine(s);
              if (z.length <= 60) return z;
              return z.slice(0, 59).replace(/\s+$/g, '') + '…';
            }
            const prefix = art === 'idee' ? '[Idee]' : (art === 'sprache' ? '[Feedback (Sprache)]' : '[Feedback]');
            const kurz = vorschau(text);
            const title = (kurz ? prefix + ' ' + kurz : prefix).slice(0, 240);
            let body = text;
            if (art === 'idee') body = 'Art: Idee' + (name ? '\nName: ' + name : '') + '\n\n' + text;
            else if (art === 'sprache') body = 'Art: Feedback (Sprache)\nQuelle: Sprache' + (name ? '\nName: ' + name : '') + '\n\n' + text;
            else if (name) body = 'Name: ' + name + '\n\n' + text;
            const labels = art === 'sprache' ? ['feedback', 'sprache'] : [art === 'idee' ? 'idee' : 'feedback'];
            const farbe = { feedback: 'd93f0b', idee: '6f42c1', sprache: '1d76db' };
            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: farbe[label] || 'd93f0b'
                });
              } catch (e) { /* Label gibt es schon */ }
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: labels
            });
